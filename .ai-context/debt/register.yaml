- id: "DEBT-018"
  summary: "`ruff check .` fails with 23 errors — E402 in both CLI scripts despite 'ruff cleanup' merge"
  classification: "confirmed-defect"
  location: "scripts/01_crawl_and_build_graph.py:18-29, scripts/02_gemini_search.py:34-46"
  evidence:
    path: "scripts/01_crawl_and_build_graph.py, scripts/02_gemini_search.py"
    symbol: "module-level imports after sys.path.insert()"
    evidence_type: "command-output"
    command: "python3 -m ruff check . --output-format=concise"
    result: "Found 23 errors (all E402 Module level import not at top of file)"
    confidence: "OBSERVED"
  impact: 2  # cosmetic/lint-gate failure, no runtime effect
  likelihood: 5  # deterministic — every run fails
  reach: 2  # two files, but blocks any lint-gated workflow (e.g. future CI per DEBT-017)
  priority_score: 20
  detail: |
    Both CLI scripts insert the project root into sys.path before their
    src/config imports (a necessary pattern for script-style execution),
    which trips E402. Commit 74f2aa5 ('Auto-fix ruff lint findings') did
    not address these, and [tool.ruff] in pyproject.toml has no E402
    ignore or per-file-ignores for scripts/. Any CI gate running
    `ruff check .` (as recommended in DEBT-017 remediation) will fail.
  recommended_action: >
    Either add per-file-ignores to [tool.ruff]
    ("scripts/*" = ["E402"]) acknowledging the sys.path bootstrap
    pattern as intentional, or restructure imports. First option is the
    smallest safe improvement.
  smallest_safe_improvement: "Add [tool.ruff.lint.per-file-ignores] \"scripts/*\" = [\"E402\"] to pyproject.toml"
  validation_plan: "python3 -m ruff check . exits 0 after change"
  status: "resolved"
  resolved_date: "2026-08-23"
  resolution_commit: "68fc0c42f3ae5abe5216a5ff13575168bdaa9c93"
  resolution_note: >-
    Applied the smallest_safe_improvement: added
    [tool.ruff.lint.per-file-ignores] "scripts/*" = ["E402"] under the
    existing [tool.ruff] section of pyproject.toml, acknowledging the
    sys.path bootstrap pattern as intentional. Validated:
    python3 -m ruff check . -> "All checks passed!" exit 0 (previously 23
    E402 errors), and pytest tests/unit/ tests/integration/ still green
    (139 passed).
