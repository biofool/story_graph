# Technical Debt Register
# Sorted by priority_score (impact × likelihood × reach), highest first.
# All items are OBSERVED from source code analysis unless marked otherwise.
# Classification: confirmed-defect / architectural-risk / code-smell / improvement-opportunity / evidence-gap

- id: "DEBT-001"
  summary: "WebCrawler._parse_page() has no try/except — malformed HTML can crash the crawl"
  classification: "confirmed-defect"
  location: "src/crawler/web_crawler.py:67 (_parse_page)"
  evidence:
    path: "src/crawler/web_crawler.py"
    symbol: "_parse_page"
    evidence_type: "source"
    confidence: "OBSERVED"
  impact: 4  # 1-5: crash halts entire crawl run
  likelihood: 3  # 1-5: lxml is resilient but edge cases exist
  reach: 4  # 1-5: affects every crawl run
  priority_score: 48
  detail: |
    _parse_page() calls BeautifulSoup(html, "lxml") with no exception
    handling. While lxml is generally robust, certain malformed inputs
    or encoding issues can raise. The outer crawl() loop catches
    exceptions per-page, but _parse_page itself is called outside that
    catch in some code paths. A single bad page could abort the run.
  recommended_action: "Wrap _parse_page body in try/except, return error CrawledPage on failure"

- id: "DEBT-002"
  summary: "No SQLite foreign key enforcement — orphan edges/sources possible"
  classification: "architectural-risk"
  location: "src/storage/graph_db.py:27-64 (SCHEMA_SQL)"
  evidence:
    path: "src/storage/graph_db.py"
    symbol: "SCHEMA_SQL"
    evidence_type: "source"
    confidence: "OBSERVED"
  impact: 3  # data integrity
  likelihood: 2  # callers generally add nodes before edges
  reach: 5  # all graph data
  priority_score: 30
  detail: |
    edges and claim_sources tables have no FOREIGN KEY constraints
    referencing nodes/sources. PRAGMA foreign_keys is never set.
    Code-level ordering (add_node before add_edge) prevents most
    orphans, but nothing enforces it at the DB level. A bug in
    process_page() ordering could silently create dangling edges.
  recommended_action: "Add FK constraints + PRAGMA foreign_keys=ON, or document the ordering contract"

