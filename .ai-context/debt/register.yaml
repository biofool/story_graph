- id: "DEBT-004"
  summary: "No database migration framework — schema is additive-only with CREATE TABLE IF NOT EXISTS"
  classification: "architectural-risk"
  location: "src/storage/graph_db.py:27 (SCHEMA_SQL)"
  evidence:
    path: "src/storage/graph_db.py"
    symbol: "SCHEMA_SQL"
    evidence_type: "source"
    confidence: "OBSERVED"
  impact: 4  # schema evolution blocked
  likelihood: 2  # currently stable, but future changes are hard
  reach: 5  # all existing databases
  priority_score: 40
  detail: |
    Schema uses CREATE TABLE IF NOT EXISTS exclusively. No ALTER TABLE,
    no migration framework, no schema_version tracking. Existing
    data/graph.db files cannot be upgraded if columns are added or
    types change — the only option is to rebuild from scratch.
  recommended_action: "Add a schema_version table + migration scripts, or document rebuild-only policy"

- id: "DEBT-005"
  summary: "Timeline edge sorting uses string comparison on dates — breaks for non-ISO formats"
  classification: "confirmed-defect"
  location: "src/extractor/contradiction_detector.py:151 (build_timeline_edges)"
  evidence:
    path: "src/extractor/contradiction_detector.py"
    symbol: "build_timeline_edges"
    evidence_type: "source"
    confidence: "OBSERVED"
  impact: 2  # wrong timeline ordering, not data corruption
  likelihood: 3  # dates from web crawls are inconsistently formatted
  reach: 2  # only timeline edges
  priority_score: 12
  detail: |
    build_timeline_edges() sorts events by start_date string and
    compares with < operator. This works for ISO 8601 (YYYY-MM-DD)
    but produces wrong ordering for mixed formats (e.g. "2020"
    vs "January 2020" vs "2020-01-15"). No date parsing/validation.
  recommended_action: "Parse dates to datetime objects before comparison; fall back to string sort on parse failure"

- id: "DEBT-006"
  summary: "Each GraphDB operation commits individually — no transaction batching for bulk inserts"
  classification: "improvement-opportunity"
  location: "src/storage/graph_db.py (add_node, add_edge, add_source, add_claim_source_link)"
  evidence:
    path: "src/storage/graph_db.py"
    symbol: "add_node, add_edge, add_source"
    evidence_type: "source"
    confidence: "OBSERVED"
  impact: 2  # performance on large crawls
  likelihood: 4  # always happens — every insert commits
  reach: 4  # all pipeline runs
  priority_score: 32
  detail: |
    Every add_node/add_edge/add_source call ends with self._conn.commit().
    For a 200-page crawl producing thousands of nodes/edges, this means
    thousands of individual fsync calls. No batch/transaction API exists.
  recommended_action: "Add a context manager or batch method that defers commit; or use INSERT OR IGNORE with executemany"

- id: "DEBT-007"
  summary: "Single SQLite connection — no concurrent access support"
  classification: "architectural-risk"
  location: "src/storage/graph_db.py:84 (sqlite3.connect)"
  evidence:
    path: "src/storage/graph_db.py"
    symbol: "GraphDB.__init__"
    evidence_type: "source"
    confidence: "OBSERVED"
  impact: 2  # only matters if parallelism is added
  likelihood: 1  # currently single-process, no concurrency
  reach: 3  # all DB access
  priority_score: 6
  detail: |
    GraphDB opens a single sqlite3.Connection with default
    check_same_thread=True. No connection pool, no WAL mode.
    If the pipeline is ever parallelized (e.g. concurrent crawling
    + extraction), this will serialize or error.
  recommended_action: "Document single-writer constraint; add WAL mode if read-during-write is needed"

