  classification: "code-smell"
  location: "scripts/_pipeline_helpers.py (process_page)"
  evidence:
    path: "scripts/_pipeline_helpers.py"
    symbol: "process_page"
    evidence_type: "source"
    confidence: "OBSERVED"
  impact: 3  # unhandled error kills pipeline run
  likelihood: 2  # extractors are generally stable
  reach: 4  # sole extraction→storage bridge
  priority_score: 24
  detail: |
    process_page() is the single integration point between extractors
    and GraphDB. At 312 LOC it handles entity normalization, relation
    mapping, claim storage, and source classification — all without
    try/except. Any exception (bad data, DB error) propagates to the
    caller and aborts the pipeline.
  recommended_action: "Add per-page try/except with logging; consider splitting into smaller functions"

