- id: "DEBT-015"
  summary: "No retry on non-200 HTTP responses — only retries on exceptions"
  classification: "improvement-opportunity"
  location: "src/crawler/web_crawler.py:62 (_fetch)"
  evidence:
    path: "src/crawler/web_crawler.py"
    symbol: "_fetch"
    evidence_type: "source"
    confidence: "OBSERVED"
  impact: 2  # transient 503/429 not retried
  likelihood: 3  # common for blog servers
  reach: 3  # all crawl runs
  priority_score: 18
  detail: |
    @retry decorator on _fetch() only retries on raised exceptions.
    Non-200 responses (503, 429, 502) are returned as-is without
    raising, so tenacity never triggers. Transient server errors
    are treated as permanent failures.
  recommended_action: "Raise on non-200 (or specific retryable codes) to let tenacity handle them"

