# Unknowns Register
# Items where evidence is insufficient to establish a claim.
# Each entry identifies what would resolve the unknown.

- id: "UNKNOWN-001"
  summary: "Facebook/Meta Graph API integration referenced in docs and config but no implementation code exists"
  classification: "evidence-gap"
  declared_claim:
    statement: "The app accesses data through Meta Graph API endpoints for public Facebook Page content"
    source: "docs/privacy_policy.md, docs/app_review_submission.md, .env.example:FB_ACCESS_TOKEN"
    evidence_type: "DECLARED"
  observed_behavior:
    statement: "No Python code in src/, scripts/, or config/ imports or references Facebook Graph API, requests to facebook.com, or FB_ACCESS_TOKEN beyond the settings field definition"
    source: "grep across all .py files for 'facebook', 'FB_ACCESS_TOKEN', 'graph api'"
    evidence_type: "OBSERVED"
  what_would_resolve: |
    1. Check git history for a deleted scripts/03_facebook_research.py
       (docs/app_review_submission.md:29 references it by name).
    2. Check other branches (feature/extraction-and-gemini-integration)
       for Facebook integration code.
    3. Confirm whether the Meta App Review was submitted and whether
       the integration is planned but not yet implemented.
  impact: "Agent may assume Facebook crawling works; docs describe a feature that doesn't exist in code"
  confidence: "OBSERVED — absence of code is confirmed; intent is UNKNOWN"

