# Conflicts Register
# Contradictions between declared claims and observed behavior.
# Per spec: resolution UNKNOWN until verified.

- id: "CONFLICT-001"
  summary: "README project structure says src/scrapers/ but actual code is in src/crawler/"
  declared_claim:
    statement: "Project structure section lists `src/scrapers/web_crawler.py` as the crawler location"
    source: "README.md:85-86"
    evidence_type: "DECLARED"
  observed_behavior:
    statement: "The actual directory is `src/crawler/web_crawler.py` — no `src/scrapers/` directory exists. All imports use `from src.crawler.web_crawler import ...`"
    source: "find . -type d -name 'scrapers' (none); src/crawler/web_crawler.py exists; grep imports confirm src.crawler"
    evidence_type: "OBSERVED"
  resolution: "OBSERVED_WINS"
  resolution_evidence: "Code and all imports use src/crawler/. README is stale."
  pending_fix: >-
    RESOLVED — commit 90ea00c on gitlab/fix/seed-url-and-readme-schema fixed
    this README drift and was merged into main as 1d897fe on 2026-08-23.
    See resolution_update below.
  impact_if_agent_trusts_wrong_side: "Agent following README would look in src/scrapers/, find nothing, and waste time or create a duplicate directory"
  resolution_update:
    status: "resolved_by_merge"
    date: "2026-08-23"
    merge_commit: "1d897fef162b1aaf468785a238648f6e48e7202f"
    note: "README project structure now lists src/crawler/web_crawler.py; verified against disk layout post-merge."

- id: "CONFLICT-002"
  summary: "README project structure omits src/llm/ directory entirely"
  declared_claim:
    statement: "README project structure section lists src/storage/, src/scrapers/, src/extractors/, src/utils/ but not src/llm/"
    source: "README.md:81-90"
    evidence_type: "DECLARED"
  observed_behavior:
    statement: "src/llm/ exists with 4 modules (gemini_client.py, entity_claim_extractor.py, graph_qa.py, seed_discoverer.py) and is a major architectural component (the Gemini integration layer)"
    source: "ls src/llm/; import analysis in relationships.yaml"
    evidence_type: "OBSERVED"
  resolution: "OBSERVED_WINS"
  resolution_evidence: "src/llm/ is a core package with 4 modules and extensive tests."
  impact_if_agent_trusts_wrong_side: "Agent would not know the LLM layer exists, missing a major component when assessing change impact"
  resolution_update:
    status: "still_open"
    date: "2026-08-23"
    merge_commit_checked: "1d897fef162b1aaf468785a238648f6e48e7202f"
    note: >-
      The seed-url-and-readme-schema merge (1d897fe) corrected the
      scrapers/extractors directory names but did NOT add src/llm/ (nor
      scripts/02_gemini_search.py) to the README project structure tree.
      Omission persists at 1d897fe; conflict remains open.

