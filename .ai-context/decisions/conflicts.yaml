- id: "CONFLICT-004"
  summary: "docs/app_review_submission.md references scripts/03_facebook_research.py but no such file exists"
  declared_claim:
    statement: "Screencast guidelines say 'running 03_facebook_research.py or querying datasette data/graph.db'"
    source: "docs/app_review_submission.md:29"
    evidence_type: "DECLARED"
  observed_behavior:
    statement: "No scripts/03* file exists in the repo. Only scripts/01_crawl_and_build_graph.py and scripts/02_gemini_search.py exist."
    source: "ls scripts/03* (no results); find . -name '03_*' (none)"
    evidence_type: "OBSERVED"
  resolution: "UNKNOWN"
  resolution_evidence: |
    The script may have existed in a prior commit and been removed,
    or may exist on an unmerged branch, or may be planned but not
    yet written. The Meta App Review docs describe Facebook Graph
    API integration that has no implementation in the current codebase.
  impact_if_agent_trusts_wrong_side: "Agent may assume Facebook research script exists and try to run or modify it"

- id: "CONFLICT-005"
  summary: "docs/privacy_policy.md describes Meta Graph API data access but no implementation code exists"
  declared_claim:
    statement: "Our application accesses data exclusively through official Meta Graph API endpoints"
    source: "docs/privacy_policy.md:11"
    evidence_type: "DECLARED"
  observed_behavior:
    statement: "No Python code imports or calls Facebook Graph API. .env.example defines FB_ACCESS_TOKEN but no code reads it beyond the settings field. The crawler targets blogs, Wikipedia, and news sites — not Facebook."
    source: "grep -rn 'facebook|FB_ACCESS_TOKEN|graph api' src/ scripts/ config/"
    evidence_type: "OBSERVED"
  resolution: "UNKNOWN"
  resolution_evidence: |
    The privacy policy and app review docs describe a Facebook
    integration that is either planned, was removed, or exists
    elsewhere. The current codebase has no Facebook functionality.
    This is a documentation-vs-code contradiction, not a code bug.
  impact_if_agent_trusts_wrong_side: "Agent may believe the system handles Facebook data and design changes around non-existent functionality. Could also be a compliance concern if the privacy policy is public."

- id: "CONFLICT-006"
  summary: "README project structure lists src/extractors/ with 4 files but actual src/extractor/ has different filenames"
  declared_claim:
    statement: "README shows extractors/entity_extractor.py, alias_resolver.py, claim_extractor.py, contradiction_detector.py"
    source: "README.md:87-90"
    evidence_type: "DECLARED"
  observed_behavior:
    statement: "Actual src/extractor/ contains exactly these 4 files (entity_extractor.py, alias_resolver.py, claim_extractor.py, contradiction_detector.py) — filenames match, only the directory name differs (singular vs plural)"
    source: "ls src/extractor/"
    evidence_type: "OBSERVED"
  resolution: "OBSERVED_WINS"
  resolution_evidence: "File names are correct; only the parent directory name is wrong in README."
  impact_if_agent_trusts_wrong_side: "Minor — file names are right, directory name is wrong (covered by CONFLICT-003)"
